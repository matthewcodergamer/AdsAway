<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AdsAway</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-protection="loading">
  <main class="app" aria-live="polite">
    <header class="topbar">
      <div class="identity">
        <div class="logo-wrap">
          <img src="icons/icon48.png" class="logo" alt="">
        </div>
        <div class="identity-copy">
          <div class="product-line">
            <h1>AdsAway</h1>
            <span class="version-chip">V1</span>
          </div>
          <p id="statusText">Checking protection…</p>
        </div>
      </div>

      <label class="power-switch" aria-label="Turn AdsAway on or off">
        <input id="globalToggle" type="checkbox">
        <span class="power-track">
          <span class="power-thumb"></span>
        </span>
      </label>
    </header>

    <section class="hero-card">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-icon">
        <img src="icons/icon128.png" alt="">
      </div>
      <div class="hero-copy">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="protectionLabel">Protected</span>
        </div>
        <h2 id="siteLabel">This website</h2>
        <p id="siteState">Ads and popups are being blocked</p>
      </div>
    </section>

    <section class="stats-grid" aria-label="Blocked on this tab">
      <article class="stat-card">
        <div class="stat-icon">↗</div>
        <strong id="popupCount">0</strong>
        <span>Popups</span>
      </article>
      <article class="stat-card">
        <div class="stat-icon">▣</div>
        <strong id="overlayCount">0</strong>
        <span>Overlays</span>
      </article>
      <article class="stat-card">
        <div class="stat-icon">⊞</div>
        <strong id="tabCount">0</strong>
        <span>Ad tabs</span>
      </article>
    </section>

    <section class="settings-card">
      <div class="section-heading">
        <span>Protection</span>
        <span class="engine-chip">V1 engine</span>
      </div>

      <label class="setting-row" for="strictToggle">
        <div class="setting-icon shield-mini">◆</div>
        <div class="setting-copy">
          <strong>Strict popup shield</strong>
          <span>Stop unwanted tabs while keeping real controls usable.</span>
        </div>
        <input id="strictToggle" class="mini-toggle" type="checkbox">
      </label>

      <div class="divider"></div>

      <div class="site-action">
        <div class="setting-icon site-mini">◎</div>
        <div class="setting-copy">
          <strong>Current website</strong>
          <span>Pause AdsAway only for this site if you need to.</span>
        </div>
      </div>

      <button id="siteToggle" class="site-button" type="button">Disable on this site</button>
    </section>

    <footer class="footer-row">
      <div class="footer-status">
        <span class="footer-dot"></span>
        <span>AdsAway V1 active</span>
      </div>
      <button id="resetStats" class="reset-button" type="button">Reset stats</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
